# 블로그 분류 체계 + 분류별 질문 세트
#
# agent 가 1단계(분류 판단)와 3단계(질의응답)에서 읽는다.
# 새 분류가 생기면 2B 단계에서 여기에 추가한다 — 쓸수록 쌓이는 파일.
#
# 주의: YAML 은 들여쓰기로 구조가 결정된다. 탭 금지, 스페이스 2칸.
#       따옴표 없는 no / yes / on / off 는 불리언으로 해석되므로
#       태그나 값에 쓸 경우 반드시 따옴표로 감쌀 것.

meta:
  version: 1
  updated: 2026-08-12
  slug_rule: "영문 소문자와 하이픈만. 한글 금지"
  post_path: "_posts/YYYY-MM-DD-slug.md"
  image_path: "assets/img/posts/<slug>/"


# ─────────────────────────────────────────────────────────
# 모든 글에 공통으로 묻는 것
# ─────────────────────────────────────────────────────────
common_questions:
  - key: audience
    q: "대상 독자 수준은?"
    options: [학부, 대학원, 실무 엔지니어, 비전공자]
    default: 대학원

  - key: length
    q: "글 길이는 대략?"
    options: ["짧게 (1500자 내외)", "보통 (3000자 내외)", "길게 (5000자 이상)"]
    default: "보통 (3000자 내외)"

  - key: thesis
    q: "이 글에서 독자가 가져갈 핵심 메시지 한 줄은?"
    type: free

  - key: figures
    q: "그림이 필요한 편인가? (구체안은 설계 단계에서 정함)"
    options: ["개념도 위주", "시뮬레이션 결과 위주", "둘 다", "없어도 됨"]

  - key: math
    q: "수식이 들어가는가?"
    options: ["예", "아니오"]
    note: "예 → front matter 에 math: true"


# ─────────────────────────────────────────────────────────
# 대분류
# ─────────────────────────────────────────────────────────
categories:

  # ═══════════════════════════════════════════════════════
  광학:
    description: "전자기학 기초부터 계측 장비까지. 박막 모델링 포함"
    keywords:
      - 전자기파
      - 맥스웰
      - 굴절률
      - 편광
      - 간섭
      - 회절
      - 분광
      - 박막
      - 엘립소메트리
      - 반사계
      - 간섭계
      - 렌즈
      - 결상
      - 푸리에

    subcategories:
      전자기학:
        description: "Maxwell 방정식, 파동 방정식, 경계 조건, 물질 내 전파"
      기하광학:
        description: "광선 추적, 결상, 수차, 조리개·시야"
      파동광학:
        description: "간섭, 회절, 코히런스, 가우시안 빔"
      분광학:
        description: "분광기 구조, 파장 분해, 광원·검출기, 스펙트럼 해석"
      편광:
        description: "Jones/Stokes 형식, Mueller 행렬, 위상지연자, 편광자"
      계측장비:
        description: "반사계·타원계·간섭계의 원리, 구성, 정렬, 보정"
      푸리에광학:
        description: "공간주파수, 후초평면, 전달함수, MTF"
      박막모델링:
        description: "다층 박막 전자기파 해석, 전달행렬, 분산 모델, 피팅"

    questions:
      - "다루는 물리량은 무엇인가? (반사율, 위상, 편광 상태 등)"
      - "어떤 근사를 쓰는가? 그 근사가 깨지는 조건은?"
      - "실제 계측에서 이 개념이 어디에 걸리는가?"
      - "측정 가능한 양과 알고 싶은 양 사이의 관계는?"
      - "장비 관점에서 무엇이 정밀도를 제한하는가?"

  # ═══════════════════════════════════════════════════════
  최적화:
    description: "계측 데이터에서 파라미터를 뽑아내는 수치 방법"
    keywords:
      - gradient
      - 경사하강
      - 뉴턴법
      - 레벤버그
      - 마쿼트
      - 최소자승
      - 피팅
      - 수렴
      - 야코비안
      - 헤시안
      - 회귀
      - 신경망

    subcategories:
      수치해법:
        description: "gradient descent, Newton, Gauss-Newton, Levenberg-Marquardt"
      회귀:
        description: "최소자승, 신경망 회귀, 정규화, 과적합"

    questions:
      - "목적 함수는 어떤 형태인가? (선형/비선형, 볼록/비볼록)"
      - "수렴 조건과 수렴 속도는?"
      - "초기값에 얼마나 민감한가? Local minimum 문제는?"
      - "다른 방법 대비 언제 유리하고 언제 불리한가?"
      - "계측 데이터에 적용할 때 실무적으로 걸리는 지점은?"

  # ═══════════════════════════════════════════════════════
  이미지처리:
    description: "측정 영상에서 신호를 뽑아내는 방법론"
    keywords:
      - 피팅
      - 엣지
      - 필터
      - 컨볼루션
      - 커널
      - 노이즈
      - 이상탐지
      - autoencoder
      - 자동부호화기
      - 모아레
      - 구조광
      - 위상천이
      - ROI

    subcategories:
      기하피팅:
        description: "직선·원·타원 피팅, 엣지 검출, 서브픽셀 추정"
      필터링:
        description: "커널 컨볼루션, 주파수 영역 필터, 스무딩"
      이상탐지:
        description: "Autoencoder 기반 이물·결함 검출, 복원 오차 해석"
      노이즈제거:
        description: "주기성 배경 노이즈, 푸리에 영역 제거, 조명 불균일 보정"
      모아레:
        description: "구조광 투사, 위상천이, HCGMP, 단차·형상 측정"

    questions:
      - "입력 데이터의 형태는? (비트 심도, 노이즈 특성, 해상도)"
      - "전처리에서 어떤 가정을 하는가?"
      - "언제 실패하는가? 실패를 어떻게 감지하는가?"
      - "계산 비용은? 실시간 처리가 가능한가?"
      - "물리적 의미와 이미지 연산이 어떻게 연결되는가?"


# ─────────────────────────────────────────────────────────
# 위 분류에 속하지 않는 글
# ─────────────────────────────────────────────────────────
# 2B 단계에서 새 분류를 만들 때 참고할 기본형.
# 새 대분류를 만들기 전에 기존 대분류의 소분류로 들어갈 수 있는지 먼저 검토할 것.
fallback:
  questions:
    - "이 글이 다루는 대상은 무엇인가?"
    - "독자가 이미 알고 있다고 가정할 수 있는 것은?"
    - "이 글을 쓰는 계기는? (문제 상황, 계기가 된 작업)"
    - "결론적으로 무엇을 주장하거나 보여주는가?"

  new_category_checklist:
    - "기존 대분류의 소분류로 들어갈 수 있는가? → 가능하면 소분류로"
    - "앞으로 최소 3편 이상 쓸 축인가? → 아니면 만들지 말 것"
    - "질문 세트가 기존 것과 실질적으로 다른가?"
