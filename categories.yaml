# 블로그 분류 체계 + 분류별 질문 세트
#
# agent 가 1단계(분류 판단)와 3단계(질의응답)에서 읽는다.
# 새 분류가 생기면 2B 단계에서 여기에 추가한다 — 쓸수록 쌓이는 파일.
#
# 주의: YAML 은 들여쓰기로 구조가 결정된다. 탭 금지, 스페이스 2칸.
#       따옴표 없는 no / yes / on / off 는 불리언으로 해석되므로
#       태그나 값에 쓸 경우 반드시 따옴표로 감쌀 것.

meta:
  version: 2
  updated: 2026-09-05
  slug_rule: "영문 소문자와 하이픈만. 한글 금지"
  post_path: "_posts/YYYY-MM-DD-slug.md"
  image_path: "assets/img/posts/<slug>/"


# ─────────────────────────────────────────────────────────
# 영문판 카테고리 대응표
# ─────────────────────────────────────────────────────────
# 영문 글(lang: en)은 한글 분류명을 그대로 쓰면 영문 사이트에 한글이 노출된다.
# 아래 대응명을 front matter 의 categories 에 쓴다.
#   예) 한국어판 [광학, 편광]  →  영문판 [Optics, Polarization]
en_names:
  대분류:
    광학: Optics
    계산과 알고리즘: Computation
    표면분석: Surface Analysis
    잡담: Notes
  소분류:
    전자기학: Electromagnetics
    기하광학: Geometrical Optics
    파동광학: Wave Optics
    분광학: Spectroscopy
    편광: Polarization
    계측장비: Instrumentation
    푸리에광학: Fourier Optics
    박막모델링: Thin-Film Modeling
    최적화방법: Optimization
    머신러닝: Machine Learning
    이미지프로세싱: Image Processing
    이상탐지: Anomaly Detection
    구조광계측: Structured Light
    광전자분광: Photoelectron Spectroscopy
    장비구성: Instrumentation
    정량분석: Quantification
    스펙트럼피팅: Spectrum Fitting
    깊이분석: Depth Profiling


# ─────────────────────────────────────────────────────────
# 모든 글에 공통으로 묻는 것
# ─────────────────────────────────────────────────────────
common_questions:
  - key: audience
    q: "대상 독자 수준은?"
    options: [학부, 대학원, 실무 엔지니어, 비전공자]
    default: 대학원

  - key: length
    q: "글 길이는 대략?"
    options: ["짧게 (1500자 내외)", "보통 (3000자 내외)", "길게 (5000자 이상)"]
    default: "보통 (3000자 내외)"

  - key: thesis
    q: "이 글에서 독자가 가져갈 핵심 메시지 한 줄은?"
    type: free

  - key: figures
    q: "그림이 필요한 편인가? (구체안은 설계 단계에서 정함)"
    options: ["개념도 위주", "시뮬레이션 결과 위주", "둘 다", "없어도 됨"]

  - key: math
    q: "수식이 들어가는가?"
    options: ["예", "아니오"]
    note: "예 → front matter 에 math: true"


# ─────────────────────────────────────────────────────────
# 대분류
# ─────────────────────────────────────────────────────────
categories:

  # ═══════════════════════════════════════════════════════
  광학:
    description: "전자기학 기초부터 계측 장비까지. 박막 모델링 포함"
    keywords:
      - 전자기파
      - 맥스웰
      - 굴절률
      - 편광
      - 간섭
      - 회절
      - 분광
      - 박막
      - 엘립소메트리
      - 반사계
      - 간섭계
      - 렌즈
      - 결상
      - 푸리에

    subcategories:
      전자기학:
        description: "Maxwell 방정식, 파동 방정식, 경계 조건, 물질 내 전파"
      기하광학:
        description: "광선 추적, 결상, 수차, 조리개·시야"
      파동광학:
        description: "간섭, 회절, 코히런스, 가우시안 빔"
      분광학:
        description: "분광기 구조, 파장 분해, 광원·검출기, 스펙트럼 해석"
      편광:
        description: "Jones/Stokes 형식, Mueller 행렬, 위상지연자, 편광자"
      계측장비:
        description: "반사계·타원계·간섭계의 원리, 구성, 정렬, 보정"
      푸리에광학:
        description: "공간주파수, 후초평면, 전달함수, MTF"
      박막모델링:
        description: "다층 박막 전자기파 해석, 전달행렬, 분산 모델, 피팅"

    questions:
      - "다루는 물리량은 무엇인가? (반사율, 위상, 편광 상태 등)"
      - "어떤 근사를 쓰는가? 그 근사가 깨지는 조건은?"
      - "실제 계측에서 이 개념이 어디에 걸리는가?"
      - "측정 가능한 양과 알고 싶은 양 사이의 관계는?"
      - "장비 관점에서 무엇이 정밀도를 제한하는가?"

  # ═══════════════════════════════════════════════════════
  계산과 알고리즘:
    description: "측정 데이터에서 원하는 값을 뽑아내는 계산 방법. 최적화·머신러닝·영상처리"
    keywords:
      - gradient
      - 경사하강
      - 뉴턴법
      - 레벤버그
      - 마쿼트
      - 최소자승
      - 피팅
      - 수렴
      - 야코비안
      - 헤시안
      - 회귀
      - 신경망
      - 딥러닝
      - 학습
      - 추론
      - autoencoder
      - 자동부호화기
      - 엣지
      - 필터
      - 컨볼루션
      - 커널
      - 노이즈
      - 이상탐지
      - 모아레
      - 구조광
      - 위상천이
      - ROI

    subcategories:
      최적화방법:
        description: "최소자승, gradient descent, Newton·Gauss-Newton, Levenberg-Marquardt, 전역 최적화 휴리스틱, 정규화"
      머신러닝:
        description: "신경망 회귀, 물리 기반 모델과 결합한 신호 복원, 학습 데이터 설계, 과적합과 일반화"
      이미지프로세싱:
        description: "기하 피팅(직선·원·타원), 엣지 검출과 서브픽셀 추정, 커널·주파수 영역 필터링, 조명 불균일 보정"
      이상탐지:
        description: "Autoencoder 기반 이물·결함 검출, 복원 오차 해석, 정상 데이터만으로 학습하는 설정"
      구조광계측:
        description: "모아레, 구조광 투사, 위상천이, HCGMP, 단차·형상 측정"

    questions:
      - "목적 함수 또는 손실 함수는 어떤 형태인가? (선형/비선형, 볼록/비볼록)"
      - "수렴 조건과 수렴 속도는? 초기값에 얼마나 민감한가?"
      - "입력 데이터의 형태와 노이즈 특성은? 전처리에서 무엇을 가정하는가?"
      - "다른 방법 대비 언제 유리하고 언제 불리한가?"
      - "언제 실패하는가? 실패를 어떻게 감지하는가?"
      - "물리적 의미와 계산 절차가 어떻게 연결되는가?"
      - "계산 비용은? 실시간 처리가 가능한가?"

  # ═══════════════════════════════════════════════════════
  표면분석:
    description: "표면 수 nm에서 나오는 신호로 조성·화학상태·두께를 알아내는 계측"
    keywords:
      - xps
      - esca
      - 광전자
      - 광전효과
      - 결합에너지
      - 화학이동
      - imfp
      - 표면민감성
      - auger
      - 오제
      - 스퍼터
      - 깊이프로파일
      - arxps
      - 초고진공
      - 대전보정

    subcategories:
      광전자분광:
        description: "XPS/UPS 원리, 광전효과, 결합에너지, 화학이동, 초기·최종상태 효과"
      장비구성:
        description: "X선원과 단색화기, 반구형 분석기, pass energy, 검출기, UHV"
      정량분석:
        description: "피크 면적과 조성, 감도인자(RSF), 투과함수, 대전 보정"
      스펙트럼피팅:
        description: "배경 모델(Shirley/Tougaard), Voigt·비대칭 선형, 제약조건"
      깊이분석:
        description: "IMFP와 정보깊이, ARXPS, 오버레이어 두께식, 스퍼터 깊이 프로파일"

    questions:
      - "측정되는 것(운동에너지 분포)과 알고 싶은 양 사이에 어떤 모델이 끼어 있는가?"
      - "이 신호는 어느 깊이에서 왔는가? 표면민감성이 여기서 득인가 실인가?"
      - "스펙트럼의 이 구조는 초기상태 효과인가 최종상태 효과인가?"
      - "정량값을 믿으려면 어떤 가정이 성립해야 하는가? (균일층, 감도인자, 대전 보정)"
      - "측정 중에 시료가 변하지는 않는가? (빔 손상, 우선 스퍼터링, 오염층)"


  # ═══════════════════════════════════════════════════════
  잡담:
    description: "기술 주제가 아닌 글. 블로그 운영, 회고, 도구 셋업 기록"
    keywords: [소개, 회고, 블로그, 운영, 셋업]
    subcategories: {}
    questions:
      - "이 글을 쓰는 계기는?"
      - "읽는 사람이 가져갈 것이 있는가?"


# ─────────────────────────────────────────────────────────
# 위 분류에 속하지 않는 글
# ─────────────────────────────────────────────────────────
# 2B 단계에서 새 분류를 만들 때 참고할 기본형.
# 새 대분류를 만들기 전에 기존 대분류의 소분류로 들어갈 수 있는지 먼저 검토할 것.
fallback:
  questions:
    - "이 글이 다루는 대상은 무엇인가?"
    - "독자가 이미 알고 있다고 가정할 수 있는 것은?"
    - "이 글을 쓰는 계기는? (문제 상황, 계기가 된 작업)"
    - "결론적으로 무엇을 주장하거나 보여주는가?"

  new_category_checklist:
    - "기존 대분류의 소분류로 들어갈 수 있는가? → 가능하면 소분류로"
    - "앞으로 최소 3편 이상 쓸 축인가? → 아니면 만들지 말 것"
    - "질문 세트가 기존 것과 실질적으로 다른가?"
