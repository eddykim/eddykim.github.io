name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # PR에서는 빌드·검증까지만 하고 배포하지 않는다.
  # main이 깨진 채로 배포가 멈추는 사고(2026-09-02~04)를 막기 위한 장치다.
  pull_request:
    branches:
      - main

  # 예약 발행용 재빌드: 월·수·금 20:10 KST (= 11:10 UTC)
  # GitHub Pages는 푸시 시점에만 빌드하므로, 미래 날짜로 적은 글은
  # 예약 시각이 지난 뒤 누군가 빌드를 걸어줘야 실제로 게시된다.
  # 잦은 재빌드는 PWA 캐시 이름을 매번 바꿔 방문자에게 불필요한
  # "새 콘텐츠" 알림을 띄우므로, 발행일에만 최소로 돌린다.
  schedule:
    - cron: "10 11 * * 1,3,5"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    # PR 이벤트에서는 배포하지 않는다 (검증 전용)
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
